<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Doctors &amp; Specialists | EveryDay Clinic</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html">EveryDay Clinic</a>
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <nav aria-label="Primary Navigation">
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a class="active" href="doctors.html">Doctors</a></li>
          <li><a href="appointment.html">Book Appointment</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-header">
        <h1>Our Doctors &amp; Specialists</h1>
        <p>Search by doctor name or filter by medical specialty.</p>
      </div>

      <div class="filter-bar">
        <input type="search" id="doctorSearch" placeholder="Search doctor name, specialty, or care focus..." aria-label="Search doctors" />
        <select id="specialtyFilter" aria-label="Filter by specialty">
          <option value="all">All Specialties</option>
          <option value="General Medicine">General Medicine</option>
          <option value="Pediatrics">Pediatrics</option>
          <option value="Dermatology">Dermatology</option>
          <option value="Orthopedics">Orthopedics</option>
        </select>
      </div>

      <p id="resultCount" style="color:var(--muted); font-size:0.9rem; margin-bottom:1rem;"></p>
      <div class="grid-2" id="doctorsList"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div>
        <strong>EveryDay Clinic</strong>
      </div>
      <ul class="footer-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="doctors.html">Doctors</a></li>
        <li><a href="appointment.html">Book Appointment</a></li>
        <li><a href="services.html">Services</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </div>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
